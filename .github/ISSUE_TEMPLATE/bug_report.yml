name: Bug Report
description: File a bug report to help us improve the AntiGravity platform.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please ensure the bug has not already been reported in the issue tracker.
  - type: input
    id: URL
    attributes:
      label: URL
      description: The URL where the bug occurred.
      placeholder: "https://jakefieldhouse.co.uk/..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I click the booking button..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser Context
      description: Which browser are you seeing this issue in?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - iOS Safari
        - Android Chrome
        - Other (Specify in additional context)
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (e.g., screenshots, console errors, OS version).
    validations:
      required: false
